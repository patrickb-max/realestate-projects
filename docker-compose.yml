
services:
  core-services:
    image: reprojects-core-services:multistage
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    environment:
      - PDF_SERVICE_URL=http://pdf-renderer:3004
    depends_on:
      - pdf-renderer

  admin-services:
    image: reprojects-admin-services:multistage
    ports:
      - "3002:3002"
    env_file:
      - .env.docker
    environment:
      - PDF_SERVICE_URL=http://pdf-renderer:3004
    depends_on:
      - pdf-renderer

  pdf-renderer:
    image: reprojects-pdf-renderer:multistage
    ports:
      - "3004:3004"
    env_file:
      - .env.docker