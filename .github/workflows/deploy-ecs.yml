name: Deploy to ECS Fargate

on:
  workflow_run:
    workflows: ["Build and Push to ECR"]
    types: [completed]
    branches: [main, feat/ecs-fargate-infra]
  push:
    branches: [main, feat/ecs-fargate-infra]
    paths:
      - 'infra/ecs/**'
      - '.github/workflows/deploy-ecs.yml'
  workflow_dispatch:

env:
  AWS_REGION: ap-south-2
  ECR_REGISTRY: 551897326491.dkr.ecr.ap-south-2.amazonaws.com
  ROLE_ARN: arn:aws:iam::551897326491:role/GitHubActionsECRRole
  ECS_CLUSTER: reprojects-prod
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || 'latest' }}

permissions:
  id-token: write
  contents: read

jobs:
  deploy-ecs:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Render PDF Renderer Task
        id: render-pdf
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/ecs/pdf-renderer-task.json
          container-name: pdf-renderer
          image: ${{ env.ECR_REGISTRY }}/reprojects/pdf-renderer:${{ env.IMAGE_TAG }}

      - name: Deploy PDF Renderer
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-pdf.outputs.task-definition }}
          service: pdf-renderer
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Render Core Services Task
        id: render-core
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/ecs/core-services-task.json
          container-name: core-services
          image: ${{ env.ECR_REGISTRY }}/reprojects/core-services:${{ env.IMAGE_TAG }}

      - name: Deploy Core Services
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-core.outputs.task-definition }}
          service: core-services
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Render Admin Services Task
        id: render-admin
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/ecs/admin-services-task.json
          container-name: admin-services
          image: ${{ env.ECR_REGISTRY }}/reprojects/admin-services:${{ env.IMAGE_TAG }}

      - name: Deploy Admin Services
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-admin.outputs.task-definition }}
          service: admin-services
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
