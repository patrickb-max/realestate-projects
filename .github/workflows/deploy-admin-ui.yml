name: Deploy Admin UI (Control Panel)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/admin-ui/**'
      - 'apps/design-system/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/admin-ui-cd.yml'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  S3_BUCKET_ADMIN: ${{ secrets.S3_BUCKET_ADMIN }}
  CLOUDFRONT_ADMIN_ID: ${{ secrets.CLOUDFRONT_ADMIN_ID }}

jobs:
  deploy-admin-ui:
    name: Build & Deploy Admin UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Admin UI
        env:
          VITE_ADMIN_API_URL: ${{ secrets.PROD_ADMIN_API_URL }}
        run: npm run build --workspace=@reprojects/admin-ui

      - name: Configure AWS Credentials (OIDC Handshake)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3 (Pass 1 - Immutable Assets)
        run: |
          aws s3 sync apps/admin-ui/build s3://$S3_BUCKET_ADMIN \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Deploy to S3 (Pass 2 - HTML Entrypoint)
        run: |
          aws s3 cp apps/admin-ui/build/index.html s3://$S3_BUCKET_ADMIN/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront Cache
        if: env.CLOUDFRONT_ADMIN_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_ADMIN_ID \
            --paths "/*"
