# 1. WORKFLOW FILE NAME: Appears in the left sidebar of your GitHub Actions tab.
name: Deploy Web UI (User Portal)

# 2. TRIGGERS: Defines what events start this pipeline.
on:
  # Allows you to run the workflow manually from the GitHub Actions UI.
  workflow_dispatch:
  # Runs automatically when code is pushed to the 'main' branch.
  push:
    branches:
      - main
    # Path filter: Only runs if files relevant to the web UI were changed.
    paths:
      - 'apps/web-ui/**'
      - 'apps/design-system/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-ui-cd.yml'

# 3. PERMISSIONS: Required for Passwordless OIDC authentication with AWS.
permissions:
  id-token: write # Allows GitHub to generate a short-lived OIDC JWT token for AWS authentication.
  contents: read  # Allows GitHub to read the repository contents.

# 4. GLOBAL ENVIRONMENT VARIABLES: Maps GitHub secrets to environment variables.
env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  S3_BUCKET_WEB: ${{ secrets.S3_BUCKET_WEB }}
  CLOUDFRONT_WEB_ID: ${{ secrets.CLOUDFRONT_WEB_ID }}

# 5. JOBS: Defines the individual jobs that make up the workflow.
jobs:
  deploy-web-ui:
    name: Build & Deploy Web UI
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository to access the code.
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js environment for building the web UI.
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Log environment info before installing dependencies.
      - name: Log Runner Environment
        run: |
          echo "=== RUNNER & GIT DIAGNOSTICS ==="
          echo "Commit SHA: $GITHUB_SHA"
          echo "Branch Ref: $GITHUB_REF"
          echo "Target Region: $AWS_REGION"
          echo "Target S3 Bucket: $S3_BUCKET_WEB"
          echo "Node Version: $(node -v)"
          echo "NPM Version: $(npm -v)"

      # Step 4: Clean install exact dependency versions from package-lock.json.
      - name: Install Dependencies
        run: |
          echo "=== INSTALLING DEPENDENCIES ==="
          npm ci

      # Step 5: Compile the SvelteKit web UI into static assets for deployment.
      - name: Build Web UI
        env:
          VITE_CORE_API_URL: ${{ secrets.PROD_CORE_API_URL }}
        run: |
          echo "=== BUILDING @reprojects/web-ui ==="
          npm run build --workspace=@reprojects/web-ui
          echo "=== VERIFYING COMPILED BUILD ARTIFACTS ==="
          ls -lh apps/web-ui/build

      # Step 6: Exchange GitHub OIDC token for temporary AWS IAM credentials.
      - name: Configure AWS Credentials (OIDC Handshake)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Step 7: Verify which AWS IAM role is currently assumed and the AWS account ID.
      - name: Log Assumed AWS Identity
        run: |
          echo "=== VERIFYING ASSUMED AWS OIDC IDENTITY ==="
          aws sts get-caller-identity

      # Step 8: Upload hashed JS/CSS assets to S3 with 1-year immutable cache headers.
      - name: Deploy to S3 (Pass 1 - Immutable Assets)
        run: |
          echo "=== PASS 1: SYNCING HASHED ASSETS TO S3 ==="
          aws s3 sync apps/web-ui/build s3://$S3_BUCKET_WEB \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

      # Step 9: Upload the HTML entrypoint to S3 with no-cache headers.
      - name: Deploy to S3 (Pass 2 - HTML Entrypoint)
        run: |
          echo "=== PASS 2: UPLOADING HTML (NO-CACHE) ENTRYPOINT TO S3 ==="
          aws s3 cp apps/web-ui/build/index.html s3://$S3_BUCKET_WEB/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      # Step 10: List uploaded S3 objects in the workflow logs for verification.
      - name: Log S3 Bucket Contents
        run: |
          echo "=== VERIFYING FILES IN S3 BUCKET ==="
          aws s3 ls s3://$S3_BUCKET_WEB --recursive --human-readable --summarize

      # Step 11: Clear CloudFront cache if CLOUDFRONT_WEB_ID is set.
      - name: Invalidate CloudFront Cache
        if: env.CLOUDFRONT_WEB_ID != ''
        run: |
          echo "=== INVALIDATING CLOUDFRONT CACHE ==="
          aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_WEB_ID \
            --paths "/*"