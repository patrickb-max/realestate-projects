
name: Frontend CI/CD (OIDC -> S3 / CloudFront)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/web-ui/**'
      - 'apps/admin-ui/**'
      - 'apps/design-system/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-cd.yml'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  S3_BUCKET_WEB: ${{ secrets.S3_BUCKET_WEB }}
  CLOUDFRONT_WEB_ID: ${{ secrets.CLOUDFRONT_WEB_ID }}
  S3_BUCKET_ADMIN: ${{ secrets.S3_BUCKET_ADMIN }}
  CLOUDFRONT_ADMIN_ID: ${{ secrets.CLOUDFRONT_ADMIN_ID }}

jobs:
  deploy-web-ui:
    name: Deploy User Portal (Web UI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web UI
        env:
          VITE_CORE_API_URL: ${{ secrets.PROD_CORE_API_URL }}
        run: npm run build --workspace=@reprojects/web-ui

      - name: Configure AWS Credentials (OIDC Handshake)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3 (Pass 1 - Immutable Assets)
        run: |
          aws s3 sync apps/web-ui/build s3://$S3_BUCKET_WEB \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Deploy to S3 (Pass 2 - HTML Entrypoint)
        run: |
          aws s3 cp apps/web-ui/build/index.html s3://$S3_BUCKET_WEB/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront Cache
        if: env.CLOUDFRONT_WEB_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_WEB_ID \
            --paths "/*"